# Reusable: deploy one environment with the artifacts built once in deploy.yml, then smoke test it.
name: deploy-env

on:
  workflow_call:
    inputs:
      env: { type: string, required: true }
    secrets:
      ALERT_EMAIL: { required: false }

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}   # prod requires your approval (GitHub environment rule)
    concurrency: deploy-${{ inputs.env }}
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build, path: build }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5, terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.env }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Apply
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform apply -input=false -auto-approve -var-file=envs/${{ inputs.env }}.tfvars \
            -var="region=${{ vars.AWS_REGION }}"
      - name: Smoke test (runs the whole pipeline on 1 video)
        run: bash ../scripts/smoke_test.sh "$(terraform output -raw state_machine_arn)"
