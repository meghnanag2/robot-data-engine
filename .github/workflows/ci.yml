name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC login to AWS for terraform plan
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test

  terraform-plan:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build artifacts
        working-directory: .
        run: make build
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - run: terraform fmt -check -recursive
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform validate
      - name: Plan (dev)
        run: |
          terraform plan -input=false -no-color -lock=false -var-file=envs/dev.tfvars \
            -var="region=${{ vars.AWS_REGION }}" -out=tfplan > plan.txt || (cat plan.txt; exit 1)
          { echo '### Terraform plan (dev)'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
