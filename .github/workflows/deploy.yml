name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "bootstrap/**"]   # docs and one-time bootstrap changes don't redeploy
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" && make lint && make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with: { name: build, path: build/*.zip, retention-days: 30 }

  dev:
    needs: build
    uses: ./.github/workflows/_deploy-env.yml
    with: { env: dev }
    secrets: inherit

  prod:
    needs: dev
    uses: ./.github/workflows/_deploy-env.yml
    with: { env: prod }
    secrets: inherit
