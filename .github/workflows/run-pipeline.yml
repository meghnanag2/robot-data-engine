# Start a pipeline run without opening the AWS console: a button in the Actions tab. Runs only on demand.
name: run-pipeline

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [dev, prod]
        default: dev
      dataset:
        type: string
        default: lerobot/pusht
      max_videos:
        type: number
        default: 1

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          ENV="${{ inputs.env || 'dev' }}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ARN="arn:aws:states:${{ vars.AWS_REGION }}:${ACCOUNT}:stateMachine:rde-${ENV}-pipeline"
          bash scripts/smoke_test.sh "$ARN" "${{ inputs.dataset || 'lerobot/pusht' }}" "${{ inputs.max_videos || 1 }}"
