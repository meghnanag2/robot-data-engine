[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rde"
version = "0.1.0"
description = "Robot data engine: ingest, extract, clean and version robot learning data on AWS"
requires-python = ">=3.11"
dependencies = []  # boto3 is provided by the Lambda and Glue runtimes

[project.optional-dependencies]
extract = ["av>=12", "numpy>=1.26", "pillow>=10"]
spark = ["pyspark==3.5.*"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "boto3>=1.34", "moto[s3]>=5", "numpy>=1.26", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=rde --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "jobs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S310", "N812"]  # N812: pyspark "functions as F" convention  # asserts in tests; urlopen is limited to the fixed HF host

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"jobs/*" = ["S608"]  # table name comes from Terraform, not user input
